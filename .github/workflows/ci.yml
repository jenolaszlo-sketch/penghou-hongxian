name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  latticedb-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore from public NuGet
        run: >
          dotnet restore Penghou.Hongxian.slnx
          --source https://api.nuget.org/v3/index.json
          --packages "${{ runner.temp }}/hongxian-latticedb-packages"
          --force --force-evaluate --no-cache

      - name: Run LatticeDB provider conformance
        run: >
          dotnet test tests/Penghou.Hongxian.Tests/Penghou.Hongxian.Tests.csproj
          --configuration Release --no-restore
          --filter FullyQualifiedName~LatticeDbExperienceProviderTests

      - name: Pack LatticeDB provider
        run: >
          dotnet pack Penghou.Hongxian.slnx
          --configuration Release --no-restore --output artifacts
          --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Restore and audit packed LatticeDB consumer
        shell: pwsh
        run: ./tools/verify_packed_consumer.ps1 -PackageDirectory artifacts -Version 0.0.0-ci.${{ github.run_id }}

  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore from public NuGet
        run: >
          dotnet restore Penghou.Hongxian.slnx
          --source https://api.nuget.org/v3/index.json
          --packages "${{ runner.temp }}/hongxian-nuget-packages"
          --force --force-evaluate --no-cache

      - name: Build
        run: dotnet build Penghou.Hongxian.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Penghou.Hongxian.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Penghou.Hongxian.slnx --configuration Release --no-build --no-restore

      - name: Run standalone example
        run: dotnet run --project samples/Penghou.Hongxian.Example --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Penghou.Hongxian.slnx --configuration Release --no-build --no-restore --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Restore and audit packed consumer
        shell: pwsh
        run: ./tools/verify_packed_consumer.ps1 -PackageDirectory artifacts -Version 0.0.0-ci.${{ github.run_id }}

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
